name: Build, test, and pack

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: dotnet-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release
  SOLUTION: Loud.Technology.Keycloak.Sdk.slnx
  PROJECT: src/libs/Keycloak/Loud.Technology.Keycloak.Sdk.csproj

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore "$SOLUTION"

      - name: Build
        run: dotnet build "$SOLUTION" --configuration "$CONFIGURATION" --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test "$SOLUTION" --configuration "$CONFIGURATION" --no-build --logger GitHubActions

      - name: Pack
        run: dotnet pack "$PROJECT" --configuration "$CONFIGURATION" --no-build --output artifacts -p:ContinuousIntegrationBuild=true

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
